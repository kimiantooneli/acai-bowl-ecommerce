<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checkout - Acai Bowl</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<section class="checkout">

<div class="container">


<h1 class="section-title">
Checkout 🍓
</h1>


<form id="checkout-form">


<input 
type="text"
id="customer-name"
placeholder="Nama lengkap"
required>


<input 
type="text"
id="customer-address"
placeholder="Alamat pengiriman"
required>


<input 
type="tel"
id="customer-phone"
placeholder="Nomor HP"
required>


<select id="payment">

<option>
Pilih metode pembayaran
</option>

<option>
Transfer Bank
</option>

<option>
COD
</option>

<option>
E-Wallet
</option>

</select>


<button class="btn" type="submit">

Pesan Sekarang

</button>


</form>


</div>

</section>


<script src="js/checkout.js"></script>


</body>

</html>
