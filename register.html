<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Acai Bowl</title>

    <link rel="stylesheet" href="css/style.css">

    <link 
    href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" 
    rel="stylesheet">

</head>


<body>


<section class="auth">

    <div class="container">


        <h1 class="section-title">
            Create Account 🍓
        </h1>


        <form id="register-form">


            <input 
            type="text" 
            id="register-name"
            placeholder="Nama lengkap"
            required>


            <input 
            type="email" 
            id="register-email"
            placeholder="Email"
            required>


            <input 
            type="password" 
            id="register-password"
            placeholder="Password"
            required>


            <button type="submit" class="btn">
                Daftar
            </button>


        </form>


        <p>
            Sudah punya akun?
            <a href="login.html">
                Login
            </a>
        </p>


    </div>

</section>


<script src="js/account.js"></script>


</body>

  </html>
