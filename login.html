<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Acai Bowl</title>

    <link rel="stylesheet" href="css/style.css">

    <link 
    href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" 
    rel="stylesheet">

</head>


<body>


<section class="auth">

    <div class="container">


        <h1 class="section-title">
            Welcome Back 💜
        </h1>


        <form id="login-form">


            <input 
            type="email"
            id="login-email"
            placeholder="Email"
            required>


            <input 
            type="password"
            id="login-password"
            placeholder="Password"
            required>


            <button type="submit" class="btn">

                Login

            </button>


        </form>


        <p>

            Belum punya akun?

            <a href="register.html">
                Daftar
            </a>

        </p>


    </div>

</section>


<script src="js/account.js"></script>


</body>

</html>
